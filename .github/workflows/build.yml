name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite runs in well under a minute; 15 fails fast on a wedged runner
    # rather than burning the 360-minute default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # The suite runs from source; this loads the published bundle itself.
      # A bundling fault (e.g. the zod 4 lazy-init crash) passes every test
      # and only shows here. agent-guide is offline and loads every module.
      - name: Smoke-test the bundled CLI
        run: node dist/cli/index.js agent-guide > /dev/null

      - run: npm test -- --coverage
